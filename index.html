<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Engineer Roadmap — 10 Month Plan</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor/fonts.css" />
  <script src="vendor/lucide.js"></script>
  <!-- Markdown -->
  <script src="vendor/marked.min.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">
          <i data-lucide="brain" class="lucide-icon logo-glyph logo-glyph-dark"></i>
          <svg class="logo-glyph logo-glyph-sakura" viewBox="-50 -50 100 100" aria-hidden="true">
            <g fill="#ffb3d4">
              <path d="M0,-5 C-15,-13 -19,-33 -9,-44 L0,-37 L9,-44 C19,-33 15,-13 0,-5 Z" />
              <path transform="rotate(72)" d="M0,-5 C-15,-13 -19,-33 -9,-44 L0,-37 L9,-44 C19,-33 15,-13 0,-5 Z" />
              <path transform="rotate(144)" d="M0,-5 C-15,-13 -19,-33 -9,-44 L0,-37 L9,-44 C19,-33 15,-13 0,-5 Z" />
              <path transform="rotate(216)" d="M0,-5 C-15,-13 -19,-33 -9,-44 L0,-37 L9,-44 C19,-33 15,-13 0,-5 Z" />
              <path transform="rotate(288)" d="M0,-5 C-15,-13 -19,-33 -9,-44 L0,-37 L9,-44 C19,-33 15,-13 0,-5 Z" />
            </g>
            <circle r="8" fill="#c2185b" />
          </svg>
          <i data-lucide="cpu" class="lucide-icon logo-glyph logo-glyph-neon"></i>
          <i data-lucide="swords" class="lucide-icon logo-glyph logo-glyph-hero"></i>
        </span>
        <div>
          <h1 class="logo-title">AI Roadmap</h1>
          <p class="logo-sub">10-Month Plan</p>
        </div>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
    </div>

    <div class="overall-progress">
      <div class="progress-ring-wrapper">
        <svg class="progress-ring" viewBox="0 0 80 80">
          <circle class="progress-ring-bg" cx="40" cy="40" r="34" />
          <circle class="progress-ring-fill" id="overallRing" cx="40" cy="40" r="34" 
            stroke-dasharray="213.63" stroke-dashoffset="213.63" />
        </svg>
        <span class="progress-ring-text" id="overallPercent">0%</span>
      </div>
      <div class="progress-ring-info">
        <div class="progress-ring-title">Overall Progress</div>
        <p class="progress-detail" id="overallDetail">0 / 0 tasks completed</p>
        <div class="progress-bar">
          <div class="progress-fill" id="overallFill"></div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Generated by JS -->
    </nav>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open sidebar menu">☰</button>
      <div class="topbar-title" id="topbarTitle">Overview</div>
      <div class="topbar-quote" id="topbarQuote" title="Motivation quote"></div>
      <div class="topbar-actions">
        <div class="profile-picker" id="profilePicker">
          <button class="profile-picker-btn" id="profilePickerBtn" aria-haspopup="true" aria-expanded="false" title="Switch profile">
            <span class="profile-picker-avatar" id="profilePickerAvatar">U</span>
            <span class="profile-picker-name" id="profilePickerName">Profile</span>
            <i data-lucide="chevron-down" class="lucide-icon sm"></i>
          </button>
          <div class="profile-picker-menu" id="profilePickerMenu" hidden></div>
        </div>
        <span class="db-status-icon db-checking" id="dbStatusIcon" data-tooltip="Checking database..."><i data-lucide="database" class="lucide-icon"></i></span>
        <span class="streak-badge" id="streakBadge" title="Current study streak"><i data-lucide="flame" class="lucide-icon"></i> 0 days</span>
      </div>
    </header>

    <div class="content" id="content">
      <!-- Generated by JS -->
    </div>
  </main>

  <canvas id="confettiCanvas"></canvas>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Quick Capture FAB -->
  <button class="quick-capture-fab" id="quickCaptureFab" title="Quick note (Ctrl+Shift+N)">+</button>

  <!-- Quick Capture Modal Overlay -->
  <div class="quick-capture-overlay" id="quickCaptureOverlay">
    <div class="quick-capture-modal">
      <div class="quick-capture-header">
        <h3><i data-lucide="zap" class="lucide-icon"></i> Quick Capture</h3>
        <button class="close-btn" id="quickCaptureClose">✕</button>
      </div>
      <textarea class="quick-capture-textarea" id="quickCaptureInput" placeholder="Jot down an idea, note, or reminder..."></textarea>
      <div class="quick-capture-footer">
        <span class="quick-capture-tag" id="quickCaptureTag">Auto-tagged: Month 01</span>
        <button class="btn btn-accent btn-sm" id="quickCaptureSave"><i data-lucide="check" class="lucide-icon sm"></i> Save</button>
      </div>
      <div class="quick-capture-hint"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> to open · <kbd>Esc</kbd> to close</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
